name: Validate ELA Quest
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data/curriculum.js
      - name: Verify required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f data/curriculum.js
